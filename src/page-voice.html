<!-- ===== 声 ===== -->
  <section class="section" id="voice" aria-labelledby="voice-h">
    <div class="wrap">
      <p class="eyebrow">VOICE</p>
      <h2 class="h2" id="voice-h">お客様の声</h2>
      <p class="lead">はじめて間もないサービスですが、ご利用いただいている方からお寄せいただいた声です。</p>

      <div class="voices">
        <figure class="voice">
          <span class="voice__mark" aria-hidden="true">“</span>
          <blockquote>
            <p class="voice__q">水曜日が待ち遠しくなりました</p>
            <p>膝を悪くしてから、風呂場の掃除がどうにもできずにいました。今は毎週きれいにしていただいて、作業のあとに少しお茶を飲みながら話すのが楽しみです。同じ方が来てくださるのがありがたい。</p>
          </blockquote>
          <figcaption class="voice__who">
            <span class="voice__av" aria-hidden="true">70代</span>
            <span class="voice__id">
              <b>78歳・女性</b>
              <small>瀬戸市／ご利用3か月</small>
            </span>
          </figcaption>
          <p class="voice__tag">定期（週1回）</p>
        </figure>
        <figure class="voice">
          <span class="voice__mark" aria-hidden="true">“</span>
          <blockquote>
            <p class="voice__q">離れて暮らす母の様子がわかる</p>
            <p>私が福岡にいるため、瀬戸市で暮らす母の生活が心配でした。訪問のたびに報告書をメールで送っていただけるので、冷蔵庫の中身や体調まで様子が伝わってきます。母も気を遣わずに済むようです。</p>
          </blockquote>
          <figcaption class="voice__who">
            <span class="voice__av" aria-hidden="true">50代</span>
            <span class="voice__id">
              <b>54歳・女性</b>
              <small>お母様(83)の代理契約</small>
            </span>
          </figcaption>
          <p class="voice__tag">ご家族からのご依頼</p>
        </figure>
        <figure class="voice">
          <span class="voice__mark" aria-hidden="true">“</span>
          <blockquote>
            <p class="voice__q">頼むまでが長かった</p>
            <p>他人を家に上げるのが嫌で、家内が亡くなってから3年ためらっていました。最初にきちんと説明を受けて、料金もはっきりしていたので決めました。もっと早く頼めばよかったです。</p>
          </blockquote>
          <figcaption class="voice__who">
            <span class="voice__av" aria-hidden="true">80代</span>
            <span class="voice__id">
              <b>81歳・男性</b>
              <small>尾張旭市／ご利用2か月</small>
            </span>
          </figcaption>
          <p class="voice__tag">はじめてのご依頼</p>
        </figure>
      </div>

      <p class="voices__note">
        掲載にあたっては、ご本人またはご家族の許可をいただいています。読みやすさのために文章を一部整えていますが、内容は変えていません。
      </p>

      <div class="prep">
        <h3>ためらわれていた理由も、よく伺います</h3>
        <p class="prep__sub">はじめてのご依頼では、次のようなご心配をお聞きします。どれも打ち合わせのときにお答えしていますので、そのままお話しください。</p>
        <ul class="prep__grid">
          <li>家に他人を入れるのに抵抗がある</li>
          <li>散らかっているところを見せたくない</li>
          <li>いくらかかるのかわからない</li>
          <li>断りづらくならないか心配</li>
        </ul>
      </div>
    </div>
  </section>
