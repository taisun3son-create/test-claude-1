      <h2 class="h2" id="voice-h">お客様の声</h2>
      <p class="lead">はじめて間もないサービスですが、ご利用いただいている方からお寄せいただいた声です。</p>

      <div class="voices">
        <figure class="voice">
          <blockquote>
            <p class="voice__q">「水曜日が待ち遠しくなりました」</p>
            <p>膝を悪くしてから、風呂場の掃除がどうにもできずにいました。今は毎週きれいにしていただいて、作業のあとに少しお茶を飲みながら話すのが楽しみです。同じ方が来てくださるのがありがたい。</p>

          <blockquote>
            <p class="voice__q">「離れて暮らす母の様子がわかる」</p>
            <p>私が福岡にいるため、瀬戸市で暮らす母の生活が心配でした。訪問のたびに報告書をメールで送っていただけるので、冷蔵庫の中身や体調まで様子が伝わってきます。母も気を遣わずに済むようです。</p>
          </blockquote>
          <figcaption class="voice__who">54歳・女性<span>／お母様(83)の代理契約</span></figcaption>
        </figure>
        <figure class="voice">
          <blockquote>
            <p class="voice__q">「頼むまでが長かった」</p>
            <p>他人を家に上げるのが嫌で、家内が亡くなってから3年ためらっていました。最初にきちんと説明を受けて、料金もはっきりしていたので決めました。もっと早く頼めばよかったです。</p>
          </blockquote>
          <figcaption class="voice__who">81歳・男性<span>／尾張旭市・ご利用2か月</span></figcaption>
        </figure>
      </div>
    </div>
